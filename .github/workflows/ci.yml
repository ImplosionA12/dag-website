# Runs the same three checks CLAUDE.md requires before a push, on every push and pull request.
# Juniors push straight to master, so this is the early warning: a red X on the commit means
# the change is live-bound and broken. Vercel will not promote a failed build, but lint and
# test failures would otherwise ship silently.
name: checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci
      # No env vars on purpose: the build must succeed with none set.
      - run: npm run build
